[project]
name = "nextsearch"
version = "1.0.0"
description = "NextSearch-1: research-agent harness and evaluation suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "datasets>=3.0",
    "huggingface-hub>=0.28",
    "python-dateutil>=2.9",
]

[project.urls]
Homepage = "https://github.com/NextTokenAI/nextsearch"
Models = "https://huggingface.co/NextTokenAI"

[project.scripts]
nextsearch-eval = "nextsearch.cli:main"
nextsearch-compat = "nextsearch.compat:main"
nextsearch-telemetry = "nextsearch.experiment.telemetry:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
# The LFM experiment layer's live Colab viewer. Kept optional so ordinary
# harness and evaluation use never pulls in plotting/notebook dependencies;
# both are preinstalled in Colab. There is no experiment tracker dependency —
# telemetry and training curves are local files rendered inline (see
# nextsearch/experiment and docs/lfm2-step1.md).
experiment = ["matplotlib>=3.7", "ipython>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nextsearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
