[project]
name = "nextsearch"
version = "1.0.0"
description = "NextSearch-1: research-agent harness and evaluation suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=1.60",
    "httpx>=0.27",
    "datasets>=3.0",
    "huggingface-hub>=0.28",
    "python-dateutil>=2.9",
]

[project.urls]
Homepage = "https://github.com/NextTokenAI/nextsearch"
Models = "https://huggingface.co/NextTokenAI"

[project.scripts]
nextsearch-eval = "nextsearch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nextsearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
